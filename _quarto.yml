project:
  type: book
  output-dir: _book

book:
  title: "Data analysis for Neuroscientists"
  reader-mode: true

  page-footer:
    left: |
      Data analysis for Neuroscientists was written by Daniel Manrique-Castano (https://orcid.org/0000-0002-1912-1764).
    right: |
      This book was created with <a href="https://quarto.org/">Quarto</a>.
  #cover-image: cover.png
  #favicon: cover.png
  #site-url: https://quarto-tdg.org/
  repo-url: https://github.com/daniel-manrique/Book_DataAnalysis_Neuroscience
  repo-branch: main
  repo-actions: [edit, issue]
  chapters:
    - index.qmd

    - part: introduction.qmd
      chapters:
        - intro-applied-modeling.qmd
        - bayesian-core-workflow.qmd
        - priors-regularization.qmd
        - mcmc-model-checking.qmd

    - part: eda-intro.qmd
      chapters:
        - eda-first-look.qmd
        - eda-data-quality.qmd
        - eda-missing-data.qmd
        - eda-ggplot.qmd
        - eda-gwalkr.qmd
        - eda-ggpairs.qmd
        - eda-summary.qmd

    - part: linear-models-intro.qmd
      chapters:
        - linear-regression-what.qmd
        - linear-regression-assumptions.qmd
        - linear-regression-single-continuous.qmd
        - linear-regression-multiple.qmd
        - glm-intro.qmd
        - logistic-regression.qmd
        - count-regression.qmd
        - beta-robust-regression.qmd

    - references.qmd

  appendices:
    - appendix-open-science.qmd
    - appendix-p-values.qmd
    - appendix-ai-assisted-modeling.qmd

format:
  html:
    theme:
      - cosmo
      - quarto-tdg.scss
    author-meta: "Daniel Manrique-Castano"
    callout-appearance: simple
    highlight-style: a11y

  pdf:
    documentclass: scrbook
    toc: true
    toc-depth: 2
    number-sections: true
    # Vector PDF figures with alpha transparency (patchwork-combined
    # plots especially) can trip XeLaTeX's picture inclusion with
    # "requested image couldn't be read" errors on some TinyTeX/cairo
    # combinations. Rasterizing to PNG for the PDF edition sidesteps
    # the whole class of problem; quality loss is negligible at 300 DPI.
    fig-format: png
    fig-dpi: 300
    highlight-style: a11y
    colorlinks: true
    fig-pos: "H"

editor: source

execute:
  freeze: auto
  warning: false
  message: false
