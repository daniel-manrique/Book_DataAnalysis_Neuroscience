# Hand-written glossary entries. scripts/build-index.R turns this file into
# glossary.qmd and adds "Where it appears" links from the terms marked in the
# chapters. Fields: term (required), definition (required, 1 to 3 sentences),
# analogy (one everyday picture), see_also (list of other terms).
# status: draft means the definition still has to be checked against the
# textbooks (NotebookLM) before the book is published.

- term: prior
  status: draft
  definition: >
    The probability distribution you give a parameter before seeing the data.
    It states which values you consider plausible and how strongly.
  analogy: >
    The hunch you carry into the lab before you open the results: a colleague
    mentioned a similar finding, or a pilot run pointed that way. It is worth
    something, but it is not proof.
  see_also: [posterior distribution, likelihood]

- term: likelihood
  status: draft
  definition: >
    How probable the data you observed would be for each possible value of the
    parameter. It is the part of the model that carries the evidence in your
    data.
  analogy: >
    A detective ranking suspects by how well each one explains the clues on the
    table.
  see_also: [prior, posterior distribution]

- term: posterior distribution
  status: draft
  definition: >
    The prior updated by the data through Bayes' theorem: a full distribution
    showing how plausible each value of the parameter is, given the model and
    the data.
  analogy: >
    What is left of your hunch after you let the experiment speak. You neither
    discard the hunch nor ignore the data; you blend them.
  see_also: [prior, likelihood, credible interval]

- term: credible interval
  status: draft
  definition: >
    A range of parameter values that holds a stated share (for example 95%) of
    the posterior distribution. Given the model, the data and the priors, the
    parameter lies inside it with that probability.
  analogy: >
    A direct statement about the effect itself: "there is a 95% probability it
    sits in this range". A confidence interval makes a different claim, about
    how often the procedure that built it captures the true value over many
    repetitions.
  see_also: [posterior distribution]

- term: offset
  status: draft
  definition: >
    A term in a count model whose coefficient is fixed at 1, so that the model
    describes a rate (counts per unit of exposure) instead of a raw count. In
    a log-link model the offset is the log of the exposure.
  analogy: >
    Cell counts from sections of different sizes are not comparable until you
    divide by the area counted. The offset does that division inside the model.
  see_also: [overdispersion]

- term: overdispersion
  status: draft
  definition: >
    More variability in the data than the chosen distribution allows. For a
    Poisson model, the variance equals the mean; overdispersion means the
    observed variance is clearly larger.
  analogy: >
    A model that expects every animal to behave about the same, while in
    reality some animals respond far more than others.
  see_also: [offset]

- term: model expansion
  status: draft
  definition: >
    Starting with a simple model, checking it against the data, and extending it
    (a more flexible shape, hierarchical structure, extra data) only where the
    check shows it fails.
  analogy: >
    Like adding instruments to a recording rig only when the signal you care
    about is not coming through, not building the whole rig on day one.

- term: multilevel model
  status: draft
  definition: >
    A model in which group-level quantities (each mouse's own baseline, each
    neuron's own firing rate) are treated as draws from a distribution whose
    spread is itself a parameter learned from the data. Also called a
    hierarchical or mixed-effects model.
  analogy: >
    A lab that estimates each mouse's speed while also learning how much mice
    differ from each other, and lets that second answer decide how much each
    mouse's own tally is trusted.
  see_also: [partial pooling, varying intercept, shrinkage]

- term: level
  status: draft
  definition: >
    One tier of a nested data structure. Attempts sit inside mice, neurons
    inside patients, cells inside sections inside animals; each tier is a level.
  analogy: >
    The folders inside folders of a data drive: the file is the lowest level,
    the animal's folder a higher one.
  see_also: [grouping factor, multilevel model]

- term: grouping factor
  status: draft
  definition: >
    The column that says which group a row belongs to (mouse, neuron, patient).
    Its categories are the groups, and it appears after the bar in a formula
    such as `(1 | mouse)`.
  analogy: >
    The animal ID written on every row of the spreadsheet.
  see_also: [level, varying intercept]

- term: complete pooling
  status: draft
  definition: >
    Estimating one value for all groups, ignoring which group a row came from.
    It is the model of ordinary regression when groups exist but are not
    modeled.
  analogy: >
    Giving every mouse the grand average as its speed.
  see_also: [no pooling, partial pooling]

- term: no pooling
  status: draft
  definition: >
    Estimating each group separately from its own rows only. It respects
    differences between groups but trusts thin groups completely.
  analogy: >
    Believing a mouse that has been tested twice as much as one tested nine
    times.
  see_also: [complete pooling, partial pooling]

- term: partial pooling
  status: draft
  definition: >
    Estimating each group as a compromise between its own data and the
    overall average, leaning on its own data more as the group has more of it.
    The balance is learned from the data through the group-level spread.
  analogy: >
    A rubber band between each mouse's own tally and the group's: a short
    tally is pulled harder than a long one.
  see_also: [shrinkage, complete pooling, no pooling]

- term: shrinkage
  status: draft
  definition: >
    The pull of a group's estimate toward the overall average that partial
    pooling produces. It is strongest for extreme estimates and for groups
    with little data, and it lowers the average error across groups.
  analogy: >
    The batting average after ten at-bats comes down toward the league average
    because part of the extreme was luck.
  see_also: [partial pooling, multilevel model]

- term: varying intercept
  status: draft
  definition: >
    An intercept that differs between groups, each one drawn from a common
    distribution. In formula syntax, `(1 | mouse)`.
  analogy: >
    Each mouse has its own baseline speed, but all baselines come from the
    population of mice.
  see_also: [varying slope, grouping factor]

- term: varying slope
  status: draft
  definition: >
    A slope (an effect of a predictor) that differs between groups, drawn from
    a common distribution and usually correlated with the varying intercept. In
    formula syntax, `(1 + day | mouse)`.
  analogy: >
    Each mouse has its own rate of improving from day to day.
  see_also: [varying intercept, multilevel model]

- term: intraclass correlation
  status: draft
  definition: >
    The share of the total variance of an outcome that lies between groups
    instead of within them. It measures how much two rows of the same group
    resemble each other.
  analogy: >
    How tightly the dots of each mouse huddle around its own average compared
    with how far the averages of different mice are from each other.
  see_also: [design effect, multilevel model]

- term: design effect
  status: draft
  definition: >
    The factor by which clustering inflates the variance of an average,
    $1 + (m-1)\rho$ with $m$ rows per group and $\rho$ the intraclass
    correlation. Dividing the number of rows by it gives the effective sample
    size.
  analogy: >
    Eight copies of the same photograph weigh as much as eight photographs but
    show one scene.
  see_also: [intraclass correlation]

- term: pseudoreplication
  status: draft
  definition: >
    Analyzing repeated measurements of the same experimental unit (cells,
    sections or regions of one animal) as if each were an independent
    replicate. The apparent sample size is then larger than the number of
    units that were actually randomized, and the intervals are too narrow for
    comparisons between units.
  analogy: >
    Interviewing every member of twelve families and reporting the answers as
    if you had asked forty-odd unrelated people.
  see_also: [design effect, intraclass correlation, multilevel model]

- term: nested grouping
  status: draft
  definition: >
    A structure in which every level of a lower factor belongs to one and only
    one level of a higher factor, such as sections inside mice. In formula
    syntax, `(1 | mouse/section)`, which expands to
    `(1 | mouse) + (1 | mouse:section)`.
  analogy: >
    Nested boxes: a slide exists only inside one box, and the slide called
    "Scene 1" in one mouse has nothing to do with "Scene 1" in another.
  see_also: [crossed grouping, grouping factor, varying intercept]

- term: crossed grouping
  status: draft
  definition: >
    A structure in which the levels of one grouping factor appear across several
    levels of another, such as animals each tested in every experimental block.
    In formula syntax, `(1 | animal) + (1 | block)`.
  analogy: >
    The rows and columns of a grid: every animal sits in every block, so
    neither factor lives inside the other.
  see_also: [nested grouping, grouping factor]

- term: caterpillar plot
  status: draft
  definition: >
    A plot of the estimated intercept of every group, with its credible
    interval, ordered from lowest to highest. It shows how much the groups
    differ and how sure the model is about each one.
  analogy: >
    A line of animals sorted by height, each with a measuring-error stick: you
    see the spread of the whole line, and which differences are bigger than
    the error.
  see_also: [varying intercept, shrinkage]

- term: non-centered parameterization
  status: draft
  definition: >
    A way of writing a varying effect so that the sampler draws a standardized
    deviation and multiplies it by the group-level standard deviation, instead
    of drawing the group's intercept directly. It removes the funnel in the
    posterior that causes divergent transitions when the standard deviation is
    small, and it is the default of `brms`.
  analogy: >
    Measuring each group in units of the group spread instead of in absolute
    units, so the shape the sampler walks on no longer narrows to a neck when
    the spread is small.
  see_also: [varying intercept, multilevel model]

- term: correlated varying effects
  status: draft
  definition: >
    Two or more varying effects of the same group (for example the intercept
    and the slope of each mouse) modeled together as a draw from a multivariate
    normal distribution, with a correlation between them. In formula syntax,
    `(1 + x | group)`; the double bar `(1 + x || group)` sets the correlation
    to zero.
  analogy: >
    Two items on a restaurant bill: a table that orders expensive starters
    tends to order expensive mains, and a model that ignores it misjudges the
    tables that do both.
  see_also: [varying slope, LKJ prior]

- term: LKJ prior
  status: draft
  definition: >
    A prior distribution for a correlation matrix, with one parameter, eta. For
    a single correlation its density is proportional to (1 - rho^2)^(eta - 1):
    eta = 1 gives every correlation the same prior weight, and larger values
    favor correlations near zero.
  analogy: >
    How much you believe, before seeing the data, that a baseline and a response
    are tied together: eta = 1 is no opinion, and a larger eta is a growing
    skepticism of extreme links.
  see_also: [correlated varying effects, varying slope]

- term: new-group prediction
  status: draft
  definition: >
    A prediction for a group that is not in the data (a mouse not yet tested),
    which adds the spread between groups to the uncertainty about the
    population-level line. It is wider than the interval for the average group.
  analogy: >
    The average October temperature of a city is known to a fraction of a
    degree, but tomorrow's temperature still varies around it by several.
  see_also: [varying slope, partial pooling]

- term: singular fit
  status: draft
  definition: >
    A maximum-likelihood fit of a multilevel model in which a group-level
    variance is estimated at zero, or a correlation at plus or minus 1: the
    estimate sits on the boundary of the allowed values because the data cannot
    support the covariance structure that was asked for.
  analogy: >
    Asking a survey of eight households to tell you how each household's taste
    in music depends on its taste in food: the answer comes out as an exact
    rule, which the data cannot justify.
  see_also: [correlated varying effects, varying slope]

- term: conditional effect
  status: draft
  definition: >
    The effect of a predictor in a multilevel model for a group at a given value
    of its varying effect, usually zero. With a log or a logit link it is the
    effect for the typical neuron or mouse, which is what a coefficient of a
    generalized multilevel model means.
  analogy: >
    The height of the median child in a class: a real child, but not the
    average height of the class when a few students are very tall.
  see_also: [marginal effect, varying intercept]

- term: marginal effect
  status: draft
  definition: >
    The effect of a predictor averaged over the whole population of groups
    (neurons, mice), instead of for one group at its typical value. With an
    identity link it equals the conditional effect; with a log or a logit link
    it does not, and it is the number a reader usually has in mind.
  analogy: >
    The average height of the class, which the tall students pull above the
    height of the median child.
  see_also: [conditional effect, new-group prediction]

- term: latent scale
  status: draft
  definition: >
    The scale of the linear predictor (the log of the rate, the log-odds),
    before the outcome is counted or flipped. Variances and intraclass
    correlations "on the latent scale" describe how alike the underlying rates
    or probabilities are, not how alike the observed counts or successes are.
  analogy: >
    How busy a bakery is on a given morning, before the luck of who happens to
    walk in decides how many loaves it sells.
  see_also: [intraclass correlation, offset]

- term: grouped cross-validation
  status: draft
  definition: >
    Cross-validation whose folds hold whole groups (all the trials of a neuron,
    all the attempts of a mouse) out of the fit, so that the held-out data
    belong to groups the model has never seen. It answers "how well do I predict
    a new group", which ordinary leave-one-out does not.
  analogy: >
    Testing a student on a chapter they have not opened, instead of on another
    question from a chapter they studied with the answer key.
  see_also: [new-group prediction, multilevel model]

- term: observation-level random effect
  status: draft
  definition: >
    A varying intercept with one level per row of the data, added to a model so
    that each observation has its own deviation. In a Poisson model it is the
    lognormal-Poisson alternative to the negative binomial (a gamma-Poisson) for
    overdispersed counts; in a beta model it carries the variation between
    sessions that a single precision cannot.
  analogy: >
    Letting every single morning at the bakery have its own busyness, instead
    of assuming that busyness is the same all day.
  see_also: [overdispersion, varying intercept]

- term: ordinal outcome
  status: draft
  definition: >
    An outcome made of ordered categories (a deficit grade from 0 to 3, a
    clinical item scored 0 to 4): we know that a higher grade is more, but not
    that the step from one grade to the next is the same size everywhere.
  analogy: >
    The rungs of a ladder whose rungs are not evenly spaced: you know which
    rung is higher, not how far apart two rungs are.
  see_also: [cumulative logit model, threshold]

- term: cumulative logit model
  status: draft
  definition: >
    A regression for an ordinal outcome that supposes a hidden continuous
    severity, shifted by the predictors, and cut by thresholds into the grades
    that are observed. It models the probability of being at or below each
    grade (also called the proportional odds model).
  analogy: >
    A rope that nobody can see, with knots at uneven distances: the rope is the
    severity, each knot a cut, and the grade written down is the segment where
    the animal sits.
  see_also: [threshold, proportional odds assumption, latent scale]

- term: threshold
  status: draft
  definition: >
    In an ordinal model, a cut point on the hidden severity scale between two
    neighboring grades. K grades need K minus 1 thresholds, and their spacing
    is estimated from the data, not assumed to be equal.
  analogy: >
    A knot in the rope: where the severity stops being grade 2 and starts being
    grade 3.
  see_also: [cumulative logit model, ordinal outcome]

- term: proportional odds assumption
  status: draft
  definition: >
    The assumption of the cumulative logit model that a predictor shifts the
    hidden severity by the same amount at every threshold, so that one
    coefficient describes the effect on the odds of being above any cut.
  analogy: >
    Sliding the whole rope to the right: every knot moves by the same distance.
  see_also: [cumulative logit model, category-specific effect]

- term: category-specific effect
  status: draft
  definition: >
    A coefficient allowed to differ from one threshold to the next (in brms,
    cs()). It relaxes the proportional odds assumption for one predictor, at
    the price of more parameters.
  analogy: >
    Letting each knot of the rope move by its own distance when the animal
    changes group.
  see_also: [proportional odds assumption]

- term: categorical logit model
  status: draft
  definition: >
    A regression for an outcome with several categories that have no order
    (also called multinomial logit). Each category except a reference one gets
    its own linear predictor, and the softmax turns the predictors into
    probabilities that are positive and add up to one.
  analogy: >
    Three doors with no order among them: each has an attractiveness for the
    person walking by, and the softmax turns the attractiveness into the
    chance of choosing each door.
  see_also: [reference category, independence of irrelevant alternatives]

- term: reference category
  status: draft
  definition: >
    The class of a categorical outcome whose linear predictor is fixed at zero,
    so that the model is identified. Every other coefficient is a log-odds
    against it, and changing it changes every coefficient.
  analogy: >
    The ground floor of a building: every other floor is described by how far
    it is above it.
  see_also: [categorical logit model]

- term: independence of irrelevant alternatives
  status: draft
  definition: >
    A property of the categorical logit model: the odds between two classes
    depend only on those two classes, not on which other classes exist. It fails
    when two classes are close substitutes.
  analogy: >
    Offering commuters a blue bus identical to the red one: the model would take
    a third of each of the car, red bus and blue bus, though in reality the
    two buses would just split the same riders.
  see_also: [categorical logit model]

- term: distributional regression
  status: draft
  definition: >
    A regression in which more than the mean of the outcome has a formula of its
    own: the spread (sigma), the precision of a beta, the shape of a gamma or the
    probability of a structural zero can each depend on predictors, usually on a
    log or logit scale.
  analogy: >
    An incubator with two dials, one for the temperature you want and one for
    how much it is allowed to wobble. Each dial can follow its own rule.
  see_also: [ratio of standard deviations, coefficient of variation]

- term: ratio of standard deviations
  status: draft
  definition: >
    The exponential of a coefficient of the log standard deviation in a
    distributional model: how many times more (or less) the animals of one group
    scatter than those of the reference group.
  analogy: >
    Saying that one pipette is "twice as shaky" as another, instead of giving the
    difference of their errors in microlitres.
  see_also: [distributional regression, coefficient of variation]

- term: coefficient of variation
  status: draft
  definition: >
    The standard deviation divided by the mean. A gamma or lognormal outcome
    has a constant coefficient of variation: its spread is a fixed fraction of
    its mean.
  analogy: >
    The "accurate to 2%" on the label of a pipette, as against "accurate to
    1 microlitre", which does not care how much you pipette.
  see_also: [distributional regression]

- term: multivariate regression
  status: draft
  definition: >
    A regression with two or more outcomes measured on the same unit, each with
    its own formula, fitted together so that the leftovers of the outcomes
    within a unit are allowed to be correlated.
  analogy: >
    Two dancers who follow the same choreography: the model describes the
    choreography for each, and also whether their small deviations move
    together.
  see_also: [residual correlation]

- term: residual correlation
  status: draft
  definition: >
    The correlation between the leftovers (residuals) of two outcomes after the
    predictors of the model have been used. It answers whether two markers still
    go together once the day, the condition or the dose is held fixed.
  analogy: >
    Shoe size and reading score correlate across children of all ages and hardly
    at all among children of one age: the second is the residual correlation.
  see_also: [multivariate regression, correlated varying effects]

- term: nonlinear regression model
  status: draft
  definition: >
    A regression in which the mean depends on the predictors through a formula
    with named parameters (a level, a plateau, a rate), instead of one
    coefficient per term. Its parameters can be read in the units of the
    outcome or of time, and the curve cannot leave the values that the formula
    allows.
  analogy: >
    A thermostat sentence instead of a line: the room is at 21 degrees now, it
    cools toward 15, and it loses half of the gap every ten minutes.
  see_also: [Gaussian process, derived quantity]

- term: derived quantity
  status: draft
  definition: >
    A function of the parameters that answers a question you can say in the
    lab (the day of the peak, the rate of change on a given day, the day when a
    curve returns to a reference level). It is computed row by row from the
    posterior draws, so it has its own posterior and interval.
  analogy: >
    You do not ask a thermostat for its rate constant; you ask when the room
    will be at 18 degrees, and the answer is computed from the constants.
  see_also: [posterior distribution, credible interval]

- term: Gaussian process
  status: draft
  definition: >
    A prior over whole smooth curves, built from the idea that the heights of
    the curve at two nearby inputs are correlated and the correlation fades
    with the distance between them. Two numbers control it: a length-scale and
    an amplitude.
  analogy: >
    Friends standing along a rope, one at every day: friends who stand close
    have similar heights, friends who stand far apart do not.
  see_also: [length-scale, marginal standard deviation]

- term: length-scale
  status: draft
  definition: >
    In a Gaussian process, the distance along the input (here, days) over which
    the curve keeps a memory of where it was. A long length-scale gives slow
    curves; a short one gives a curve that wiggles from one day to the next.
  analogy: >
    How many paces apart two friends on the rope must stand before they stop
    resembling each other.
  see_also: [Gaussian process, marginal standard deviation]

- term: marginal standard deviation
  status: draft
  definition: >
    In a Gaussian process, the amplitude of the curve: how far it can wander
    from its average. It sets the vertical scale of the oscillations and leaves
    their wiggliness to the length-scale.
  analogy: >
    How tall the tallest friend on the rope can be above the average height.
  see_also: [Gaussian process, length-scale]

- term: longitudinal design
  status: draft
  definition: >
    A design in which the same units (animals, patients) are measured repeatedly
    through time, so that the measurements of one unit belong together and are
    not independent. It differs from a time course across different animals,
    each measured once.
  analogy: >
    One animal photographed on five days, against five different animals each
    photographed once.
  see_also: [varying intercept, compound symmetry]

- term: compound symmetry
  status: draft
  definition: >
    A covariance structure in which every pair of measurements of the same unit
    has the same correlation, whatever the time between them. A single varying
    intercept for the unit implies it.
  analogy: >
    A trait of the animal: a timid mouse is timid on every day, whether the
    sessions are one day or three weeks apart.
  see_also: [autoregressive model of order one, varying intercept]

- term: autoregressive model of order one
  status: draft
  definition: >
    A model in which each measurement carries over a fraction of the deviation
    of the previous one, so that the correlation between two measurements
    falls with the number of steps between them (rho, rho squared, and so
    on). With unequally spaced times it needs a continuous-time version, in
    which the exponent is the gap in days.
  analogy: >
    A conversation in which each reply echoes part of the last one: the echo
    fades as the replies get farther apart.
  see_also: [compound symmetry, longitudinal design]

- term: missing at random
  status: draft
  definition: >
    Data are missing at random when the chance that a value is missing depends
    only on information that is in the model (the group, the day, the animal's
    earlier values) and not on the missing value itself. A likelihood-based
    mixed model is valid for the mean under this condition.
  analogy: >
    A mouse is skipped on a day because of the cage rack it lives in, which the
    model knows, and not because of how it was going to behave that day.
  see_also: [observation-level random effect]
