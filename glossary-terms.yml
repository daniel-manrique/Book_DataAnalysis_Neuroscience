# Hand-written glossary entries. scripts/build-index.R turns this file into
# glossary.qmd and adds "Where it appears" links from the terms marked in the
# chapters. Fields: term (required), definition (required, 1 to 3 sentences),
# analogy (one everyday picture), see_also (list of other terms).
# status: draft means the definition still has to be checked against the
# textbooks (NotebookLM) before the book is published.

- term: prior
  status: draft
  definition: >
    The probability distribution you give a parameter before seeing the data.
    It states which values you consider plausible and how strongly.
  analogy: >
    The hunch you carry into the lab before you open the results: a colleague
    mentioned a similar finding, or a pilot run pointed that way. It is worth
    something, but it is not proof.
  see_also: [posterior distribution, likelihood]

- term: likelihood
  status: draft
  definition: >
    How probable the data you observed would be for each possible value of the
    parameter. It is the part of the model that carries the evidence in your
    data.
  analogy: >
    A detective ranking suspects by how well each one explains the clues on the
    table.
  see_also: [prior, posterior distribution]

- term: posterior distribution
  status: draft
  definition: >
    The prior updated by the data through Bayes' theorem: a full distribution
    showing how plausible each value of the parameter is, given the model and
    the data.
  analogy: >
    What is left of your hunch after you let the experiment speak. You neither
    discard the hunch nor ignore the data; you blend them.
  see_also: [prior, likelihood, credible interval]

- term: credible interval
  status: draft
  definition: >
    A range of parameter values that holds a stated share (for example 95%) of
    the posterior distribution. Given the model, the data and the priors, the
    parameter lies inside it with that probability.
  analogy: >
    A direct statement about the effect itself: "there is a 95% probability it
    sits in this range". A confidence interval makes a different claim, about
    how often the procedure that built it captures the true value over many
    repetitions.
  see_also: [posterior distribution]

- term: offset
  status: draft
  definition: >
    A term in a count model whose coefficient is fixed at 1, so that the model
    describes a rate (counts per unit of exposure) instead of a raw count. In
    a log-link model the offset is the log of the exposure.
  analogy: >
    Cell counts from sections of different sizes are not comparable until you
    divide by the area counted. The offset does that division inside the model.
  see_also: [overdispersion]

- term: overdispersion
  status: draft
  definition: >
    More variability in the data than the chosen distribution allows. For a
    Poisson model, the variance equals the mean; overdispersion means the
    observed variance is clearly larger.
  analogy: >
    A model that expects every animal to behave about the same, while in
    reality some animals respond far more than others.
  see_also: [offset]

- term: model expansion
  status: draft
  definition: >
    Starting with a simple model, checking it against the data, and extending it
    (a more flexible shape, hierarchical structure, extra data) only where the
    check shows it fails.
  analogy: >
    Like adding instruments to a recording rig only when the signal you care
    about is not coming through, not building the whole rig on day one.

- term: multilevel model
  status: draft
  definition: >
    A model in which group-level quantities (each mouse's own baseline, each
    neuron's own firing rate) are treated as draws from a distribution whose
    spread is itself a parameter learned from the data. Also called a
    hierarchical or mixed-effects model.
  analogy: >
    A lab that estimates each mouse's speed while also learning how much mice
    differ from each other, and lets that second answer decide how much each
    mouse's own tally is trusted.
  see_also: [partial pooling, varying intercept, shrinkage]

- term: level
  status: draft
  definition: >
    One tier of a nested data structure. Attempts sit inside mice, neurons
    inside patients, cells inside sections inside animals; each tier is a level.
  analogy: >
    The folders inside folders of a data drive: the file is the lowest level,
    the animal's folder a higher one.
  see_also: [grouping factor, multilevel model]

- term: grouping factor
  status: draft
  definition: >
    The column that says which group a row belongs to (mouse, neuron, patient).
    Its categories are the groups, and it appears after the bar in a formula
    such as `(1 | mouse)`.
  analogy: >
    The animal ID written on every row of the spreadsheet.
  see_also: [level, varying intercept]

- term: complete pooling
  status: draft
  definition: >
    Estimating one value for all groups, ignoring which group a row came from.
    It is the model of ordinary regression when groups exist but are not
    modeled.
  analogy: >
    Giving every mouse the grand average as its speed.
  see_also: [no pooling, partial pooling]

- term: no pooling
  status: draft
  definition: >
    Estimating each group separately from its own rows only. It respects
    differences between groups but trusts thin groups completely.
  analogy: >
    Believing a mouse that has been tested twice as much as one tested nine
    times.
  see_also: [complete pooling, partial pooling]

- term: partial pooling
  status: draft
  definition: >
    Estimating each group as a compromise between its own data and the
    overall average, leaning on its own data more as the group has more of it.
    The balance is learned from the data through the group-level spread.
  analogy: >
    A rubber band between each mouse's own tally and the group's: a short
    tally is pulled harder than a long one.
  see_also: [shrinkage, complete pooling, no pooling]

- term: shrinkage
  status: draft
  definition: >
    The pull of a group's estimate toward the overall average that partial
    pooling produces. It is strongest for extreme estimates and for groups
    with little data, and it lowers the average error across groups.
  analogy: >
    The batting average after ten at-bats comes down toward the league average
    because part of the extreme was luck.
  see_also: [partial pooling, multilevel model]

- term: varying intercept
  status: draft
  definition: >
    An intercept that differs between groups, each one drawn from a common
    distribution. In formula syntax, `(1 | mouse)`.
  analogy: >
    Each mouse has its own baseline speed, but all baselines come from the
    population of mice.
  see_also: [varying slope, grouping factor]

- term: varying slope
  status: draft
  definition: >
    A slope (an effect of a predictor) that differs between groups, drawn from
    a common distribution and usually correlated with the varying intercept. In
    formula syntax, `(1 + day | mouse)`.
  analogy: >
    Each mouse has its own rate of improving from day to day.
  see_also: [varying intercept, multilevel model]

- term: intraclass correlation
  status: draft
  definition: >
    The share of the total variance of an outcome that lies between groups
    instead of within them. It measures how much two rows of the same group
    resemble each other.
  analogy: >
    How tightly the dots of each mouse huddle around its own average compared
    with how far the averages of different mice are from each other.
  see_also: [design effect, multilevel model]

- term: design effect
  status: draft
  definition: >
    The factor by which clustering inflates the variance of an average,
    $1 + (m-1)\rho$ with $m$ rows per group and $\rho$ the intraclass
    correlation. Dividing the number of rows by it gives the effective sample
    size.
  analogy: >
    Eight copies of the same photograph weigh as much as eight photographs but
    show one scene.
  see_also: [intraclass correlation]
